[Settings]
IconSize=16
MaxColumns=16
; Columns 仍兼容旧配置；建议改用 MaxColumns。
CellWidth=24
CellHeight=24
Margin=0
StayOnTop=1
ShowCaption=0
TransparentMode=1
BackgroundOpacity=76
IconOpacity=255
PressFeedback=1
PressOffset=2
HoverBorder=1
HoverGlow=1
HoverBorderColor=0x999999
HoverBorderOpacity=170
HoverBorderWidth=1
HoverGlowOpacity=55
HoverGlowSize=1
HoverRadius=0
MenuTheme=Auto
; MenuTheme=Auto/Dark/Light，控制右键菜单主题；Win7 自动退回浅色。
; 兼容旧配置：若没有 BackgroundOpacity，则读取旧的 Opacity。
; TransparentMode=1 时使用黑色半透明工具条，只绘制图标，不显示按钮边框。
; BackgroundOpacity 只控制背景/边框透明度，IconOpacity 只控制图标透明度，范围 0~255。
; PressFeedback=1 开启点击图标时的轻微下坠反馈，PressOffset 控制下坠像素。
; HoverBorder/HoverGlow 控制鼠标悬停时的边框与光晕。
; WindowX/WindowY 会在退出时自动保存（v3.3 修复右键退出保存）。
WindowX=1801
WindowY=576
WindowW=72
WindowH=24

; Path 可填 exe、bat、cmd、lnk、文件夹或网址。
; Args 是启动参数，WorkDir 是工作目录，Icon 可单独指定图标文件。


[Item1]
Name=Notepad
Path=notepad.exe
Args=
WorkDir=
Icon=
IconIndex=0
[Item2]
Name=Calculator
Path=calc.exe
Args=
WorkDir=
Icon=
IconIndex=0
